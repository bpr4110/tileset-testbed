[project]
name = "tileset-testbed"
version = "0.1.0"
description = "Generate minimal original and instanced 3D Tiles tilesets of colored shapes."
readme = "README.md"
authors = [
    { name = "John But", email = "chihinbut@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
tileset-testbed = "tileset_testbed.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tileset_testbed"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# Typer options are function calls in parameter defaults by design.
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]